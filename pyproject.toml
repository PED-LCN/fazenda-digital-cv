[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fazenda-cv-monitor"
version = "0.2.0"
description = "Local cattle computer vision pipeline for simulator and camera video"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.20,<2"]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
fazenda-cv = "fazenda_cv.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
